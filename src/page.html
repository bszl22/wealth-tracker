<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wealth Tracker</title>
<style>
  :root { --bg: #fbfaf8; --fg: #1f1d1a; --muted: #6b665e; --grid: #e6e2db; --netWorth: #2f6f5e; --assets: #3b6ea8; --liabilities: #b0563a; --error-bg: #fbeaea; --error-fg: #8a1f1f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171614; --fg: #ece8e1; --muted: #9a948a; --grid: #2e2b27; --netWorth: #6cc2a8; --assets: #7fa8d8; --liabilities: #e08a6c; --error-bg: #3a1c1c; --error-fg: #f2b8b8; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .latest { font-size: 32px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  svg { width: 100%; height: auto; margin-top: 24px; overflow: visible; }
  svg text { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .grid { stroke: var(--grid); }
  .netWorth { --series: var(--netWorth); }
  .assets { --series: var(--assets); }
  .liabilities { --series: var(--liabilities); }
  polyline { fill: none; stroke: var(--series); stroke-width: 2; }
  polyline.netWorth { stroke-width: 3; }
  circle { fill: var(--series); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 20px; margin-top: 16px; font-size: 13px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 14px; height: 3px; margin-right: 6px; vertical-align: middle; background: var(--series); }
  h2 { font-size: 17px; margin: 32px 0 8px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--grid); }
  th { font-weight: 600; font-size: 13px; color: var(--muted); }
  td.balance, th.balance { text-align: right; }
  .stale { display: inline-block; margin-left: 8px; padding: 0 6px; border-radius: 4px; font-size: 12px; background: var(--error-bg); color: var(--error-fg); }
  .error { background: var(--error-bg); color: var(--error-fg); padding: 16px 20px; border-radius: 8px; border-left: 4px solid var(--error-fg); white-space: pre-wrap; margin-top: 16px; }
  .error h2 { margin: 0 0 8px; color: inherit; }
  .scroll { overflow-x: auto; }
  table.months th, table.months td { white-space: nowrap; }
  table.months th:first-child, table.months td:first-child { position: sticky; left: 0; background: var(--bg); }
  tr.net td, tr.total td { font-weight: 600; border-top: 2px solid var(--grid); }
  tr.subcategory td { color: var(--muted); font-size: 14px; }
  tr.subcategory td:first-child { padding-left: 24px; }
  button.expand { all: unset; cursor: pointer; }
  button.expand::before { content: "▸"; display: inline-block; width: 16px; color: var(--muted); }
  button.expand[aria-expanded="true"]::before { content: "▾"; }
  button.expand:focus-visible { outline: 2px solid var(--assets); outline-offset: 2px; }
  code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  button.cell { all: unset; cursor: pointer; border-bottom: 1px dotted var(--muted); }
  button.cell:hover, button.cell[aria-pressed="true"] { color: var(--assets); border-bottom-color: var(--assets); }
  button.cell:focus-visible { outline: 2px solid var(--assets); outline-offset: 2px; }
  .transactions { margin-top: 12px; padding: 12px 16px; border: 1px solid var(--grid); border-radius: 8px; }
  .transactions h3 { font-size: 14px; margin: 0 0 4px; }
  .transactions td.description { white-space: normal; }
</style>
</head>
<body>
<main>
  <h1>Net Worth</h1>
  <div id="content" class="muted">Reading Statements…</div>
</main>
<script>
const gbp = (pence) => (pence / 100).toLocaleString("en-GB", { style: "currency", currency: "GBP" });
const dayLabel = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
const monthLabel = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("en-GB", { month: "short", year: "2-digit" });

function el(tag, attrs = {}, text) {
  const node = document.createElementNS(tag === "svg" || attrs.svg ? "http://www.w3.org/2000/svg" : "http://www.w3.org/1999/xhtml", tag);
  for (const [k, v] of Object.entries(attrs)) if (k !== "svg") node.setAttribute(k, v);
  if (text !== undefined) node.textContent = text;
  return node;
}

const SERIES = [
  { key: "netWorth", label: "Net Worth" },
  { key: "assets", label: "Total Assets" },
  { key: "liabilities", label: "Total Liabilities" },
];

function legend() {
  const node = el("div", { class: "legend" });
  for (const { key, label } of SERIES) node.append(el("span", { class: key }, label));
  return node;
}

function chart(snapshots) {
  const width = 900, height = 360, left = 80, right = 20, top = 10, bottom = 30;
  const balances = snapshots.flatMap((s) => SERIES.map(({ key }) => s[key]));
  let min = Math.min(0, ...balances), max = Math.max(...balances);
  if (max === min) max = min + 100;
  const step = niceStep((max - min) / 5);
  min = Math.floor(min / step) * step; max = Math.ceil(max / step) * step;
  const x = (i) => left + (snapshots.length === 1 ? (width - left - right) / 2 : (i * (width - left - right)) / (snapshots.length - 1));
  const y = (v) => top + ((max - v) * (height - top - bottom)) / (max - min);
  const svg = el("svg", { viewBox: `0 0 ${width} ${height}`, role: "img", "aria-label": "Net Worth, total Assets and total Liabilities at each month end" });
  for (let v = min; v <= max; v += step) {
    svg.append(el("line", { svg: 1, class: "grid", x1: left, x2: width - right, y1: y(v), y2: y(v) }));
    svg.append(el("text", { svg: 1, x: left - 8, y: y(v) + 4, "text-anchor": "end" }, gbp(v)));
  }
  snapshots.forEach((s, i) => svg.append(el("text", { svg: 1, x: x(i), y: height - 8, "text-anchor": "middle" }, monthLabel(s.monthEnd))));
  // Drawn in reverse so the Net Worth line sits on top.
  for (const { key, label } of [...SERIES].reverse()) {
    svg.append(el("polyline", { svg: 1, class: key, points: snapshots.map((s, i) => `${x(i)},${y(s[key])}`).join(" ") }));
    snapshots.forEach((s, i) => {
      const dot = el("circle", { svg: 1, class: key, cx: x(i), cy: y(s[key]), r: key === "netWorth" ? 4 : 3 });
      dot.append(el("title", { svg: 1 }, `${label}, ${monthLabel(s.monthEnd)}: ${gbp(s[key])}`));
      svg.append(dot);
    });
  }
  return svg;
}

function niceStep(raw) {
  const magnitude = 10 ** Math.floor(Math.log10(raw));
  return [1, 2, 5, 10].map((m) => m * magnitude).find((s) => s >= raw);
}

/** A table's header row, from [label, className] pairs. */
function headerRow(columns) {
  const head = el("tr");
  for (const [label, className] of columns) head.append(el("th", className ? { class: className } : {}, label));
  return head;
}

function accountTable(accounts) {
  const table = el("table");
  table.append(headerRow([["Account"], ["Kind"], ["Latest Balance", "balance"], ["Dated"]]));
  for (const { account, kind, pence, date, stale } of accounts) {
    const dated = el("td", {}, dayLabel(date));
    if (stale) dated.append(el("span", { class: "stale", title: "Latest Balance is more than 2 months old. It still counts in Net Worth." }, "Stale"));
    const row = el("tr");
    row.append(el("td", {}, account), el("td", {}, kind), el("td", { class: "balance" }, gbp(pence)), dated);
    table.append(row);
  }
  return table;
}

const monthHeading = (month) => (month.partial ? `${monthLabel(month.monthEnd)} so far` : monthLabel(month.monthEnd));

/**
 * The Transactions behind a figure: date, Account, description and amount. Amounts moving the figure the other way,
 * such as a Refund under Spending, show as negative.
 */
function transactionList(title, transactions, adds) {
  const panel = el("div", { class: "transactions" });
  panel.append(el("h3", {}, title));
  if (transactions.length === 0) {
    panel.append(el("div", { class: "muted" }, "No Transactions."));
    return panel;
  }
  const table = el("table");
  table.append(headerRow([["Date"], ["Account"], ["Description"], ["Amount", "balance"]]));
  const sorted = [...transactions].sort((a, b) => a.date.localeCompare(b.date));
  for (const { date, account, description, pence, direction } of sorted) {
    const row = el("tr");
    row.append(
      el("td", {}, dayLabel(date)),
      el("td", {}, account),
      el("td", { class: "description" }, description),
      el("td", { class: "balance" }, gbp(direction === adds ? pence : -pence)),
    );
    table.append(row);
  }
  panel.append(table);
  return panel;
}

/** A figure that lists its Transactions below `panel` when clicked, and hides them when clicked again. */
function figureButton(text, title, transactions, adds, panel) {
  const button = el("button", { class: "cell", type: "button", "aria-pressed": "false" }, text);
  button.addEventListener("click", () => {
    const opening = button.getAttribute("aria-pressed") !== "true";
    for (const other of document.querySelectorAll('button.cell[aria-pressed="true"]')) other.setAttribute("aria-pressed", "false");
    for (const other of document.querySelectorAll(".transactions-panel")) other.replaceChildren();
    if (!opening) return;
    button.setAttribute("aria-pressed", "true");
    panel.replaceChildren(transactionList(title, transactions, adds));
  });
  return button;
}

/**
 * A table with months across the top and one row per figure. A row with subrows expands to show them. Clicking a
 * figure from a row with Transactions lists them below the table, `adds` being the direction that adds to the figure.
 */
function monthTable(heading, months, rows, adds) {
  const panel = el("div", { class: "transactions-panel" });
  const table = el("table", { class: "months" });
  const head = el("tr");
  head.append(el("th", {}, heading));
  for (const month of months) head.append(el("th", { class: "balance" }, monthHeading(month)));
  table.append(head);
  const figureRow = ({ label, pence, transactions, className }, labelCell) => {
    const row = el("tr", className ? { class: className } : {});
    row.append(labelCell ?? el("td", {}, label));
    for (const month of months) {
      const cell = el("td", { class: "balance" });
      const text = gbp(pence(month));
      cell.append(transactions ? figureButton(text, `${label}, ${monthHeading(month)}: ${text}`, transactions(month), adds, panel) : text);
      row.append(cell);
    }
    return row;
  };
  for (const figure of rows) {
    if (!figure.subrows) {
      table.append(figureRow(figure));
      continue;
    }
    const subrows = figure.subrows.map((subrow) => figureRow({ ...subrow, className: "subcategory" }));
    for (const subrow of subrows) subrow.hidden = true;
    const expand = el("button", { class: "expand", type: "button", "aria-expanded": "false" }, figure.label);
    expand.addEventListener("click", () => {
      const expanded = expand.getAttribute("aria-expanded") !== "true";
      expand.setAttribute("aria-expanded", String(expanded));
      for (const subrow of subrows) subrow.hidden = !expanded;
    });
    const labelCell = el("td");
    labelCell.append(expand);
    table.append(figureRow(figure, labelCell), ...subrows);
  }
  const scroll = el("div", { class: "scroll" });
  scroll.append(table);
  const section = el("div");
  section.append(scroll, panel);
  return section;
}

/** Every Transaction behind a month's Spending or Earnings. */
const breakdownTransactions = (breakdown) => [...breakdown.categories.flatMap((c) => c.transactions), ...breakdown.uncategorisedTransactions];

/** One row per Category of the kind, expandable into its Subcategories, then Uncategorised and the total. */
function breakdownRows(categories, kind, figures) {
  const rows = categories
    .filter((category) => category.kind === kind)
    .map((category, i) => ({
      label: category.name,
      pence: (m) => figures(m).categories[i].total,
      transactions: (m) => figures(m).categories[i].transactions,
      subrows: category.subcategories.map((name, j) => ({
        label: name,
        pence: (m) => figures(m).categories[i].subcategories[j].pence,
        transactions: (m) => figures(m).categories[i].subcategories[j].transactions,
      })),
    }));
  return [
    ...rows,
    { label: "Uncategorised", pence: (m) => figures(m).uncategorised, transactions: (m) => figures(m).uncategorisedTransactions },
    {
      label: `Total ${kind}`,
      pence: (m) => figures(m).total,
      transactions: (m) => breakdownTransactions(figures(m)),
      className: "total",
    },
  ];
}

function rulesFileNote({ path, found }) {
  if (found) return el("div", { class: "muted" }, "Sorted into Categories by your Categorisation Rules. Money in under a Spending Category is a Refund, reducing it. Transfers count as neither Spending nor Earnings.");
  const note = el("div", { class: "muted" });
  note.append(
    "No rules file yet, so all Spending (money out) and Earnings (money in) is Uncategorised. To sort them into Categories, create ",
    el("code", {}, path),
    ' listing your Categories and Categorisation Rules, such as { "categories": [{ "name": "Food", "kind": "Spending", "subcategories": ["Groceries"] }], "rules": [{ "contains": "TESCO", "category": "Food", "subcategory": "Groceries" }, { "contains": "AMERICAN EXPRESS", "transfer": true }] }.',
  );
  return note;
}

/** Uncategorised descriptions, largest total first, each listing its Transactions when clicked. */
function uncategorisedList(uncategorised) {
  const section = el("div");
  section.append(el("h2", {}, "Uncategorised"));
  if (uncategorised.length === 0) {
    section.append(el("div", { class: "muted" }, "Every Transaction is sorted into a Category or marked as a Transfer."));
    return section;
  }
  section.append(el("div", { class: "muted" }, "Descriptions no Categorisation Rule matches, largest total first, so the next rule to write is at the top. Click a total to see its Transactions."));
  const panel = el("div", { class: "transactions-panel" });
  const table = el("table");
  table.append(headerRow([["Description"], ["Uncategorised"], ["Transactions", "balance"], ["Total", "balance"]]));
  for (const { description, direction, pence, transactions } of uncategorised) {
    const kind = direction === "Out" ? "Spending" : "Earnings";
    const total = el("td", { class: "balance" });
    total.append(figureButton(gbp(pence), `${description}, Uncategorised ${kind}: ${gbp(pence)}`, transactions, direction, panel));
    const row = el("tr");
    row.append(el("td", { class: "description" }, description), el("td", {}, kind), el("td", { class: "balance" }, String(transactions.length)), total);
    table.append(row);
  }
  section.append(table, panel);
  return section;
}

function spendingSection({ months, uncategorised, categories, rulesFile }) {
  const section = el("div");
  section.append(
    el("h2", {}, "Spending"),
    rulesFileNote(rulesFile),
    monthTable("Spending", months, breakdownRows(categories, "Spending", (m) => m.spending), "Out"),
    el("h2", {}, "Earnings"),
    monthTable("Earnings", months, [
      ...breakdownRows(categories, "Earnings", (m) => m.earnings),
      // Money in adds to Net and money out takes from it, under Spending and Earnings alike.
      {
        label: "Net (Earnings − Spending)",
        pence: (m) => m.net,
        transactions: (m) => [...breakdownTransactions(m.earnings), ...breakdownTransactions(m.spending)],
        className: "net",
      },
    ], "In"),
    uncategorisedList(uncategorised),
  );
  return section;
}

async function render() {
  const content = document.getElementById("content");
  const report = await fetch("/report")
    .then((r) => r.json())
    .catch(() => ({ error: "The tracker isn't responding. Is it still running? Start it with npm start, then refresh." }));
  content.replaceChildren();
  content.className = "";
  if (report.error) {
    // Shown in place of the chart, since a Net Worth built from partly read Statements could look right and be wrong.
    const error = el("div", { class: "error", role: "alert" });
    error.append(el("h2", {}, "Net Worth can't be shown"), el("div", {}, report.error));
    content.append(error);
    return;
  }
  const latest = report.snapshots.at(-1);
  if (latest) {
    content.append(el("div", { class: "latest" }, gbp(latest.netWorth)));
    content.append(el("div", { class: "muted" }, `${gbp(latest.assets)} in Assets less ${gbp(latest.liabilities)} in Liabilities, as of ${monthLabel(latest.monthEnd)} month end`));
  }
  content.append(legend(), chart(report.snapshots), el("h2", {}, "Accounts"), accountTable(report.accounts), spendingSection(report.spending));
}
render();
</script>
</body>
</html>
